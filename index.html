<style>
:root{--bg:#f3f3f3;--card:rgba(255,255,255,.86);--stroke:#e3e3e3;--fg:#1b1b1b;--mut:#5f5f5f;--tile:rgba(0,0,0,.045);--hero:#f7f2f8;--hs:#e0d4e4;--ibox:rgba(255,255,255,.8);--acc:#8a2be2;--cloud:#c9d3e3;--cloud2:#9fb0c8;--moon:#f2d36b;--mdark:#7d879b;--snow:#8fb8e8;--btn:#fff}

:root[data-theme=dark]{--bg:#202020;--card:rgba(44,44,44,.86);--stroke:#3b3b3b;--fg:#fff;--mut:#a8a8a8;--tile:rgba(255,255,255,.055);--hero:#2b2631;--hs:#40374a;--ibox:rgba(255,255,255,.08);--acc:#a970ff;--cloud:#e6edf7;--cloud2:#b3c0d4;--moon:#f4f1c9;--mdark:#2f3846;--snow:#fff;--btn:#383838}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif}
section[hidden]{display:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#lb{position:fixed;top:0;left:0;right:0;height:4px;z-index:9;display:none;background:linear-gradient(90deg,transparent,#8a2be2,transparent);background-size:40% 100%;background-repeat:no-repeat;animation:ld 1.1s linear infinite}
@keyframes ld{from{background-position:-40% 0}to{background-position:140% 0}}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 28px 48px}
#tabs{display:flex;gap:4px;padding:10px 0 4px;position:sticky;top:0;z-index:5;background:var(--bg)}
#tabs button{background:none;border:0;color:var(--fg);font:inherit;padding:8px 16px;border-radius:8px;cursor:pointer;position:relative;opacity:.7}
#tabs button.on{opacity:1;font-weight:600;background:var(--tile)}
#tabs button.on::after{content:"";position:absolute;left:16px;right:16px;bottom:1px;height:3px;border-radius:3px;background:var(--acc)}
section{padding-top:18px}
h1{margin:0;font-size:24px;font-weight:600}
h2{margin:0;font-size:22px;font-weight:600}
h3{margin:0 0 14px;font-size:19px;font-weight:600}
p{margin:0}
.sh p,.hd p{font-size:13px;opacity:.65;margin-top:2px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.sf{display:flex;gap:8px;flex:1;min-width:240px;max-width:420px}
input{flex:1;min-width:0;padding:9px 14px;border-radius:8px;border:1px solid var(--stroke);background:var(--btn);color:var(--fg);font:inherit;outline:0}
input:focus{border-color:var(--acc)}
.bt{padding:9px 14px;border-radius:10px;border:1px solid var(--stroke);background:var(--btn);color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
.bt:disabled,.cb:disabled{opacity:.35;cursor:default}
.cb{width:44px;height:44px;flex:none;border-radius:22px;border:1px solid var(--stroke);background:var(--btn);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.cb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sf .cb{width:38px;height:38px;border-radius:8px}
.lnk{background:none;border:0;color:var(--acc);font:inherit;font-size:13px;cursor:pointer;padding:4px 8px}
#sug,#favs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
#sug:not(:empty),#favs:not(:empty){margin-bottom:14px}
.fc,#sug button{flex:none;display:flex;align-items:center;gap:6px;padding:5px 14px 5px 8px;border-radius:99px;border:1px solid var(--stroke);background:var(--card);color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
#sug button{padding:6px 14px}
.fc svg{width:26px;height:26px}
#main{display:grid;gap:24px}
.ban{padding:12px;border-radius:10px;border:1px solid #ffd700;background:#ffffe0;color:#000;font-size:14px;display:flex;gap:10px;align-items:center}
.ban.r{border-color:#ff453a;background:#fde8e6}
.ban svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:18px;padding:22px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hero{background:var(--hero);border:1px solid var(--hs);border-radius:20px;padding:24px;display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center}
.ibox{width:124px;height:124px;border-radius:20px;background:var(--ibox);display:grid;place-items:center}
.ibox svg{width:96px;height:96px}
.ibox.s{width:108px;height:108px;border-radius:16px}.ibox.s svg{width:84px;height:84px}
.big{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.t54{font-size:54px;font-weight:700;line-height:1.1}
.t44{font-size:44px;font-weight:700;line-height:1.1}
.mut{opacity:.7;font-size:15px;padding-bottom:6px}
.dsc{font-size:21px;font-weight:600;opacity:.9}
.cty{font-size:17px;opacity:.75}
.upd{font-size:12px;opacity:.65;margin-top:5px}
.act{display:flex;flex-direction:column;gap:8px;align-self:start}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.nav{display:grid;grid-template-columns:auto 1fr auto;align-items:center;margin-bottom:18px}
.mid{text-align:center}.mid small{display:block;font-size:12px;opacity:.65}.mid b{font-size:21px;font-weight:600}
.main{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-bottom:18px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tiles.t4{grid-template-columns:repeat(4,1fr)}
.tile{background:var(--tile);border-radius:10px;padding:10px 12px;border:1px solid transparent;font:inherit;color:inherit;text-align:left}
.tile small{display:block;font-size:12px;opacity:.65}.tile b{font-size:15px;font-weight:600}
button.tile{cursor:pointer;background:var(--card);border-color:var(--stroke);border-radius:14px;padding:14px;position:relative}
.ar{position:absolute;right:12px;top:12px;width:34px;height:34px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.ev{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--stroke)}
.evf{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.evf input{min-width:160px}
#p1>.card{margin-top:20px}
button.tile b{font-size:20px}
button.tile.on{border-color:var(--acc)}
.sc{display:flex;gap:4px;margin:14px 0 6px}.sc i{flex:1;height:8px;border-radius:4px}
.scl{display:flex;gap:4px;font-size:11px}.scl span{flex:1;text-align:center}
.bigv{font-size:30px;font-weight:700}
.scale{height:8px;border-radius:6px;position:relative;margin:14px 0 4px;background:linear-gradient(90deg,#4cd964,#a8e05f,#ffd60a,#ff9f0a,#ff453a,#bf5af2)}
.scale u{position:absolute;top:-4px;width:4px;height:16px;background:var(--fg);border-radius:2px;transform:translateX(-50%)}
.row{display:flex;gap:26px;margin-top:10px}.row b{font-size:20px;display:block}.row span{font-size:12px;opacity:.7}
.chip{display:inline-flex;align-items:center;gap:6px;margin:0 14px 8px 0}.chip i{width:10px;height:10px;border-radius:50%}
.seg{display:inline-flex;border:1px solid var(--stroke);border-radius:8px;overflow:hidden;background:var(--btn)}
.seg button{background:none;border:0;color:var(--fg);font:inherit;font-size:14px;padding:8px 16px;cursor:pointer;opacity:.75}
.seg button.on{background:var(--acc);color:#fff;opacity:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.fr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--stroke)}
#p1 .fg,#p2>*+*{margin-top:20px}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;box-shadow:0 0 0 1px var(--stroke)}.sw button.on{border-color:var(--bg);box-shadow:0 0 0 2px var(--fg)}
.st{display:grid;gap:18px}.st .it{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.st .it small{display:block;font-size:12px;opacity:.65;margin-top:2px}.st .it b{font-weight:600}.st .it+.it{border-top:1px solid var(--stroke);padding-top:16px}
.cmp{font-size:14px;font-weight:600;margin-top:6px;color:var(--acc)}
.msg{text-align:center;padding:60px 0;opacity:.8}
@media(max-width:860px){.fg,.row2{grid-template-columns:1fr}.hero{grid-template-columns:auto 1fr}.act{grid-column:1/-1;flex-direction:row}.tiles.t4{grid-template-columns:repeat(2,1fr)}.wrap{padding:0 16px 40px}}
@media(max-width:520px){.hero{grid-template-columns:1fr;text-align:center}.hero .ibox{margin:auto}.big{justify-content:center}.tiles{grid-template-columns:repeat(2,1fr)}.main{grid-template-columns:1fr;justify-items:center;text-align:center}}
#splash{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--hero),var(--bg));transition:opacity .5s ease,visibility .5s}
#splash.off{opacity:0;visibility:hidden}
.sp-in{text-align:center;width:min(78vw,320px)}
.sp-logo{width:132px;height:132px;display:block;margin:0 auto 18px;overflow:visible}
.sp-glow{fill:#ffc933;opacity:.18;transform-box:fill-box;transform-origin:center;animation:pl 2.4s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(1);opacity:.18}50%{transform:scale(1.2);opacity:.08}}
.sp-sun{transform-box:fill-box;transform-origin:center;animation:sps 14s linear infinite}
@keyframes sps{to{transform:rotate(360deg)}}
.sp-cloud{animation:spf 3.2s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.14))}
@keyframes spf{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#splash h1{font-size:26px;font-weight:600}
#spt{font-size:14px;opacity:.7;margin:6px 0 22px;min-height:20px}
.sp-bar{height:5px;border-radius:5px;background:var(--tile);overflow:hidden}
.sp-bar i{display:block;height:100%;width:8%;border-radius:5px;background:linear-gradient(90deg,var(--acc),#6fc3f5);transition:width .5s ease}
#splash small{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:12px;opacity:.5}
@media(prefers-reduced-motion:reduce){.sp-sun,.sp-cloud,.sp-glow{animation:none}}
/* ---------- dopracowany wygląd ---------- */
body{background:radial-gradient(1100px 560px at 8% -8%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 62%),radial-gradient(900px 480px at 100% 4%,color-mix(in srgb,#3aa0ff 13%,transparent),transparent 58%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased;font-size:15.5px}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
h2{font-size:24px;font-weight:700;letter-spacing:-.015em}
h3{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:650}
h3::before{content:"";width:4px;height:18px;border-radius:4px;background:var(--acc);flex:none}
#tabs{background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:10px 0;gap:6px}
#tabs button{border-radius:999px;padding:9px 20px;transition:background .2s,color .2s,opacity .2s}

#tabs button.on{background:color-mix(in srgb,var(--acc) 17%,transparent);color:var(--acc)}
#tabs button.on::after{display:none}
.card{border-radius:24px;padding:24px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 14px 34px -16px rgba(30,10,60,.28)}
.hero{border-radius:30px;padding:30px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 24%,var(--hero)),var(--hero) 62%);border-color:color-mix(in srgb,var(--acc) 22%,var(--hs));box-shadow:0 22px 50px -24px color-mix(in srgb,var(--acc) 70%,transparent)}
.ibox{border-radius:28px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 8%,transparent),0 10px 26px -12px rgba(0,0,0,.3)}
.t54{font-size:72px;letter-spacing:-.04em;font-weight:700}
.t44{letter-spacing:-.03em}
.tile{border-radius:16px;padding:14px 16px;transition:transform .18s,border-color .18s,background .18s}
.tile small{font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.tile b{font-size:17px}
.tile:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
button.tile{border-radius:18px}
button.tile.on{box-shadow:0 0 0 2px var(--acc) inset;background:color-mix(in srgb,var(--acc) 10%,var(--card))}
input{border-radius:14px;padding:11px 16px;transition:border-color .15s,box-shadow .15s}
input:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
.bt{border-radius:12px;padding:10px 16px;font-weight:500;transition:border-color .15s,color .15s,transform .1s}
.bt:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.bt:active:not(:disabled),.cb:active:not(:disabled){transform:scale(.96)}
.cb{transition:background .15s,color .15s,border-color .15s,transform .1s}
.cb:hover:not(:disabled){background:var(--acc);border-color:var(--acc);color:#fff}
.lnk:hover{text-decoration:underline}
.fc,#sug button{transition:border-color .15s,transform .1s;box-shadow:0 2px 8px -4px rgba(0,0,0,.25)}
.fc:hover,#sug button:hover{border-color:var(--acc)}
.seg{padding:3px;gap:2px;border-radius:13px;border:0;background:var(--tile)}
.seg button{border-radius:10px;padding:8px 15px;transition:background .15s,color .15s}
.seg button:hover{opacity:1}
.seg button.on{box-shadow:0 3px 10px -3px var(--acc);font-weight:600}
.ban{border-radius:16px;padding:14px 16px;box-shadow:0 8px 20px -14px rgba(0,0,0,.4)}
.nav{margin-bottom:20px}.mid b{font-size:22px;font-weight:650}
.st .it{padding-block:2px}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:var(--stroke);border-radius:8px}
@media(max-width:700px){.wrap{padding:0 14px 40px}.card{padding:18px;border-radius:22px}.hero{padding:22px;border-radius:26px;gap:16px}.t54{font-size:58px}#tabs button{padding:8px 15px}}
@media(prefers-reduced-motion:reduce){.tile,.bt,.cb,#tabs button{transition:none}}
/* górny panel na całą szerokość */

  const row=p=>`<div class="plr"><div class="plh"><i class="dot" style="background:${PC[p.n]}"></i><b>${p.n}</b><small>jasność ${mgF(p.mag)} · ${p.mag<-3?"bardzo jasna":p.mag<0?"jasna":p.mag<2?"średnio jasna":"słaba"}</small></div><div class="plb"><span style="left:${x(p.f).toFixed(1)}%;width:${Math.max(1.5,x(p.l)-x(p.f)).toFixed(1)}%;background:${PC[p.n]}"></span></div><ul class="ipl"><li>Widoczna: <b>${p.sF?"od zmierzchu":fHM(p.f)}</b> do <b>${p.sL?"świtu":fHM(p.l)}</b></li><li>Najwyżej w nocy: <b>${Math.round(p.alt)}°</b> o ${fHM(p.tm)}, kierunek <b>${dirN(p.azM)}</b> (${Math.round(p.azM)}°)</li><li>${p.sF?"Na początku nocy":"Pojawi się"}: ${dirN(p.azF)}, ${p.sL?"o świcie":"zniknie"}: ${dirN(p.azL)}</li></ul></div>`;
  return`<div class="card" id="plc">${h}<p class="pls">Noc: ${fHM(w.s)}–${fHM(w.e)}. Planeta jest widoczna, gdy Słońce jest min. 6° pod horyzontem, a planeta min. 5° nad nim. Mapa pokazuje niebo widziane do góry (N u góry, E po lewej); przesuń suwak, by zobaczyć inną godzinę.</p><div class="plw"><div class="plx"><div id="plch">${plChart(PLT.t)}</div><div class="plsl"><span>Godzina: <b id="plt">${fHM(PLT.t)}</b></span><input type="range" min="0" max="${Math.round(tot/6e4)}" step="2" value="${Math.round((PLT.t-w.s)/6e4)}" oninput="plSet(this.value)"></div></div><div class="pll">${vs.map(row).join("")||'<p style="opacity:.75">Dziś w nocy żadna z jasnych planet nie jest widoczna.</p>'}${ns.length?`<div class="pln">Niewidoczne dziś: ${ns.map(p=>p.n+" ("+(p.el<20?"zbyt blisko Słońca":"nie ma jej na niebie w nocy")+")").join("; ")}.</div>`:""}</div></div></div>`;
}
function plSet(v){PLT.u=true;PLT.t=PLT.w.s+v*6e4;$("plch").innerHTML=plChart(PLT.t);$("plt").textContent=fHM(PLT.t)}
setInterval(()=>{if(S&&!$("p1").hidden&&!PLT.u){PLT.t=null;const e=$("plc");if(e)e.outerHTML=plCardHTML()}},3e5);
const _tb=$("tabs");_tb.addEventListener("wheel",e=>{if(_tb.scrollWidth>_tb.clientWidth&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){_tb.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
let EV=[];try{EV=JSON.parse(localStorage.getItem("ev"))||[]}catch(e){}
/* równonoce i przesilenia: tabela na lata 2026–2027; rojów meteorów – daty maksimów powtarzalne co roku */
const EQ=[[3,20,"Równonoc wiosenna"],[6,21,"Przesilenie letnie"],[9,23,"Równonoc jesienna"],[12,21,"Przesilenie zimowe"]];
const MET=[[1,3,"Kwadrantydy"],[4,22,"Lirydy"],[5,6,"Eta Akwarydy"],[8,12,"Perseidy"],[10,21,"Orionidy"],[11,17,"Leonidy"],[12,14,"Geminidy"],[12,22,"Ursydy"]];
function eventsHTML(mo){
  const t0=new Date();t0.setHours(0,0,0,0);const y=t0.getFullYear(),L=[],day=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
  mo.ph.forEach(([n,dd])=>[0,1].forEach(i=>L.push({d:day(Date.now()+(dd+i*29.530588853)*864e5),n,c:"#5ac8fa"})));
  [y,y+1].filter(z=>z<=2027).forEach(z=>EQ.forEach(([m,d,n])=>L.push({d:new Date(z,m-1,d),n,c:"#ffc933"})));
  MET.forEach(([m,d,n])=>[y,y+1].forEach(z=>L.push({d:new Date(z,m-1,d),n:n+" – maksimum roju",c:"#a970ff"})));
  EV.forEach((e,i)=>L.push({d:new Date(e.d+"T00:00:00"),n:e.n,c:"var(--acc)",i}));
  const rows=L.filter(e=>e.d>=t0).sort((a,b)=>a.d-b.d).slice(0,14).map(e=>{const n=Math.round((e.d-t0)/864e5);return `<div class="ev"><i class="dot" style="background:${e.c}"></i><div style="flex:1"><b>${e.n}</b><div style="font-size:12px;opacity:.65">${e.d.toLocaleDateString("pl-PL",{day:"numeric",month:"long",year:"numeric"})}</div></div><span>${n===0?"Dziś":n===1?"Jutro":"za "+n+" dni"}</span>${e.i!=null?`<button class="lnk" onclick="delEv(${e.i})">Usuń</button>`:""}</div>`}).join("");
  return `<div class="card"><h3>Wydarzenia astronomiczne</h3>${rows}<div class="evf"><input id="evn" placeholder="Nazwa własnego wydarzenia"><input id="evd" type="date" style="flex:none"><button class="bt" onclick="addEv()">Dodaj</button></div></div>`;
}
const addEv=()=>{const n=$("evn").value.trim(),d=$("evd").value;if(!n||!d)return;EV.push({n,d});sv("ev",EV);renderAstro()};
const delEv=i=>{EV.splice(i,1);sv("ev",EV);renderAstro()};
function renderSet(){
  const seg=(k,o,cur)=>`<div class="seg">${o.map(([v,l])=>`<button class="${String(cur)===String(v)?"on":""}" onclick='setOpt("${k}",${JSON.stringify(v)})'>${l}</button>`).join("")}</div>`;
  const it=(t,d,c)=>`<div class="it"><div><b>${t}</b><small>${d}</small></div>${c}</div>`;
  const COL=[["","Fiolet"],["#0a84ff","Niebieski"],["#12a594","Morski"],["#2fa84f","Zielony"],["#f08c00","Pomarańcz"],["#e5484d","Czerwony"]];
  const sw=`<div class="sw">${COL.map(([v,l])=>`<button title="${l}" class="${AC===v?"on":""}" style="background:${v||"#8a2be2"}" onclick='setOpt("ac",${JSON.stringify(v)})'></button>`).join("")}</div>`;
  $("p2").innerHTML=`<div class="hd"><div><h1>Ustawienia</h1><p>Jednostki, wygląd, dane i lokalizacje</p></div></div>
<div class="card"><h3>Jednostki</h3><div class="st">${it("Temperatura","Stopnie Celsjusza lub Fahrenheita",seg("t",[["C","°C"],["F","°F"]],U.t))}${it("Prędkość wiatru","Używana w prognozie i parametrach",seg("w",[["kmh","km/h"],["ms","m/s"],["mph","mph"]],U.w))}${it("Ciśnienie","Jednostka ciśnienia atmosferycznego",seg("p",[["hpa","hPa"],["mmhg","mmHg"],["inhg","inHg"]],U.p))}</div></div>
<div class="card"><h3>Wygląd</h3><div class="st">${it("Motyw","Auto podąża za ustawieniem urządzenia",seg("th",[["auto","Auto"],["light","Jasny"],["dark","Ciemny"]],TH))}${it("Kolor akcentu","Zakładki, przyciski i wykresy",sw)}${it("Animowane tło","Deszcz, śnieg, chmury i gwiazdy",seg("an",[[true,"Włączone"],[false,"Wyłączone"]],AN))}</div></div>
<div class="card"><h3>Dane i lokalizacja</h3><div class="st">${it("Lokalizacja przy starcie","GPS wymaga zgody i HTTPS, inaczej użyję przybliżonej lokalizacji z IP",seg("st",[["def","Domyślna"],["gps","GPS urządzenia"]],START))}${it("Automatyczne odświeżanie","Pobiera nową prognozę, gdy strona jest otwarta",seg("auto",[[0,"Wył."],[15,"15 min"],[30,"30 min"],[60,"1 godz."]],AR))}${it("Lokalizacja domyślna",def?def.name:"Nie ustawiono (Warszawa)",`<button class="bt" onclick="setDef()" ${S?"":"disabled"}>Ustaw bieżącą</button>`)}</div></div>
<div class="card"><h3>Ulubione miasta</h3>${favs.length?favs.map((f,i)=>`<div class="fr"><span>${f.name}</span><span><button class="lnk" onclick="load(favs[${i}]);sw(0)">Pokaż</button><button class="lnk" onclick="rmFav(${i})">Usuń</button></span></div>`).join(""):'<p style="opacity:.7">Brak ulubionych. Dodaj miasto przyciskiem w zakładce Pogoda.</p>'}</div>
<div class="card"><h3>Aplikacja i dane</h3><div class="st">${it("Instalacja",IP?"Dodaj ikonę na ekranie głównym":"W Chrome: menu ⋮ → „Zainstaluj aplikację” (wymaga HTTPS)",IP?'<button class="bt" onclick="install()">Zainstaluj</button>':"")}${it("Przywróć ustawienia domyślne","Jednostki, wygląd i odświeżanie; ulubione zostają",'<button class="bt" onclick="resetSet()">Przywróć</button>')}${it("Wyczyść dane lokalne","Usuwa ulubione, własne wydarzenia, cache i ustawienia",'<button class="bt" onclick="wipe()">Wyczyść</button>')}</div></div>`;
}
function setOpt(k,v){
  if(k==="th"){TH=v;sv("theme",v);applyTheme()}else if(k==="an"){AN=v;sv("anim",v);FK="";fx(CK,CD)}else if(k==="st"){START=v;sv("start",v)}else if(k==="ac"){AC=v;sv("accent",v);applyAcc()}else if(k==="auto"){AR=v;sv("auto",v);autoRef()}else{U[k]=v;sv("units",U)}
  render();renderFavs();
}
let AT=null;
function autoRef(){clearInterval(AT);if(AR)AT=setInterval(()=>{if(S&&!document.hidden&&navigator.onLine)load(S.c)},AR*6e4)}
function resetSet(){U={t:"C",w:"kmh",p:"hpa"};TH="auto";AN=true;AC="";AR=0;START="def";["units","theme","anim","accent","auto","start"].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});applyTheme();autoRef();render();renderFavs()}
function wipe(){if(!confirm("Usunąć wszystkie zapisane dane (ulubione, wydarzenia, ustawienia)?"))return;try{localStorage.clear()}catch(e){}favs=[];def=null;EV=[];FD=[];resetSet();S&&renderAstro()}
const setDef=()=>{def=S.c;sv("def",def);renderSet()};
const rmFav=i=>{favs.splice(i,1);sv("favs",favs);S&&render();renderSet();loadFavs()};
function sw(i){[0,1,2,3].forEach(j=>$("p"+j).hidden=j!==i);document.querySelectorAll("#tabs button").forEach((b,j)=>b.classList.toggle("on",j===i));scrollTo(0,0);const a=document.querySelector("#tabs button.on");a&&a.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"})}
/* ---------- dane ---------- */
async function load(c,note){
  $("lb").style.display="block";spl(55,"Pobieranie prognozy pogody…");
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,dew_point_2m,is_day,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_gusts_10m,wind_direction_10m,visibility&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,dew_point_2m,weather_code,precipitation_probability,pressure_msl,wind_speed_10m,wind_gusts_10m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max&timezone=auto&forecast_days=14&past_days=1`;
    const a=`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${c.lat}&longitude=${c.lon}&current=european_aqi,pm2_5,pm10,alder_pollen,birch_pollen,grass_pollen,mugwort_pollen,olive_pollen,ragweed_pollen&timezone=auto`;
    const[d,aq]=await Promise.all([fetch(u).then(r=>r.json()),fetch(a).then(r=>r.json()).catch(()=>null)]);
    spl(85,"Przygotowywanie widoku…");if(d.daily.time.length>14){const Dd=d.daily;d.y={max:Dd.temperature_2m_max[0],min:Dd.temperature_2m_min[0]};Object.keys(Dd).forEach(k=>Dd[k]=Dd[k].slice(1))}S={c,d,aq:aq&&aq.current,note};hI=0;dI=0;sel=null;sv("city",c);sv("cache",{c,d,aq:S.aq,ts:Date.now()});render();loadFavs();spEnd();
  }catch(e){let k=null;try{k=JSON.parse(localStorage.getItem("cache"))}catch(x){}if(k&&k.d){S={c:k.c,d:k.d,aq:k.aq,off:k.ts};render();spEnd();$("lb").style.display="none";return}$("main").innerHTML=ban("Nie udało się pobrać pogody. "+(e instanceof TypeError&&/fetch|network|load/i.test(e.message)?"Zapytanie do Open-Meteo zostało zablokowane. Otwórz plik w zwykłej przeglądarce albo wrzuć go na hosting.":"Błąd: "+e.message))}
  $("lb").style.display="none";spEnd();
}
async function loadFavs(){
  if(!favs.length){FD=[];return renderFavs()}
  try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${favs.map(f=>f.lat).join()}&longitude=${favs.map(f=>f.lon).join()}&current=temperature_2m,weather_code,is_day&timezone=auto`).then(r=>r.json());FD=[].concat(r).map(x=>x.current)}catch(e){FD=[]}
  renderFavs();
}
function renderFavs(){$("favs").innerHTML=favs.map((f,i)=>{const x=FD[i];return `<button class="fc" onclick="load(favs[${i}])">${x?icon(x.weather_code,x.is_day):""}<span>${f.name.split(",")[0]}</span><b>${x?fT(x.temperature_2m)+"°":""}</b></button>`}).join("")}
function toggleFav(){const c=S.c,i=favs.findIndex(f=>fe(f,c));i<0?favs.push(c):favs.splice(i,1);sv("favs",favs);render();loadFavs()}
async function search(name){
  try{
    const r=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=5&language=pl`)).json();
    if(!r.results){msg("Nie znaleziono miasta.");sug.innerHTML="";return}
    const l=r.results.map(x=>({name:x.name+(x.admin1?", "+x.admin1:""),lat:x.latitude,lon:x.longitude}));
    load(l[0]);sug.innerHTML="";
    l.slice(1).forEach(c=>{const b=document.createElement("button");b.textContent=c.name;b.onclick=()=>{load(c);sug.innerHTML=""};sug.appendChild(b)});
  }catch(e){msg("Błąd wyszukiwania.")}
}
$("f").onsubmit=e=>{e.preventDefault();if(q.value.trim()){search(q.value.trim());q.blur()}};
const WAW={name:"Warszawa",lat:52.23,lon:21.01};
async function byIP(note){spl(40,"Ustalanie przybliżonej lokalizacji…");
  try{const r=await (await fetch("https://ipwho.is/")).json();if(!r.success)throw 0;load({name:r.city+" (przybliżona lokalizacja)",lat:r.latitude,lon:r.longitude},note)}
  catch(e){msg("Nie udało się ustalić lokalizacji. Wpisz nazwę miasta w wyszukiwarce.")}
}
function locate(auto){
  const fb=n=>auto?load(def||last||WAW,n):byIP(n+" Pokazuję przybliżoną lokalizację z adresu IP.");
  if(!auto)msg("Ustalanie dokładnej lokalizacji…");else spl(30,"Ustalanie lokalizacji…");
  if(!navigator.geolocation)return fb("Ta przeglądarka nie obsługuje lokalizacji.");
  if(!window.isSecureContext)return fb("Dokładna lokalizacja wymaga połączenia HTTPS (np. strony wrzuconej na hosting).");
  navigator.geolocation.getCurrentPosition(async p=>{
    const lat=p.coords.latitude,lon=p.coords.longitude;let name="Twoja lokalizacja";
    try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=pl`).then(r=>r.json());name=r.city||r.locality||name}catch(e){}
    load({name,lat,lon,acc:Math.round(p.coords.accuracy)});
  },e=>fb(e.code===1?"Brak zgody na lokalizację. Zezwól w ustawieniach przeglądarki (ikona przy adresie strony).":e.code===3?"Przekroczono czas ustalania lokalizacji.":"Nie udało się ustalić pozycji urządzenia."),{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}
$("gps").onclick=()=>locate(false);
applyTheme();renderFavs();renderSet();autoRef();
START==="gps"?locate(true):load(def||last||WAW);
</script>
